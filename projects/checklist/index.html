<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Иконки и manifest вставляет vite-plugin-pwa (pwaAssets). theme-color —
         свой, ниже: у манифеста только один статический цвет на все темы, а
         $primary в тёмной теме светлее (#79b8c4 против #13383f), иначе статус-бар
         ОС не совпадал бы с верхним тулбаром приложения в тёмном режиме. -->
    <meta name="theme-color" content="#13383f" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#79b8c4" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="smui.css" media="(prefers-color-scheme: light)" />
    <link
      rel="stylesheet"
      href="smui-dark.css"
      media="screen and (prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Safari игнорирует manifest при добавлении на домашний экран и читает
         только эти мета-теги. Chrome ругается на apple-версию как на
         устаревшую, но убрать её нельзя — Safari другую не понимает,
         поэтому держим обе. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Чеклисты" />
    <title>Чеклисты</title>
    <script type="module" crossorigin src="/projects/checklist/assets/index-DEi4-_Zu.js"></script>
    <link rel="stylesheet" crossorigin href="/projects/checklist/assets/index-WpINlGDI.css">
  <link rel="manifest" href="/projects/checklist/manifest.webmanifest">
<link rel="icon" href="/projects/checklist/favicon.ico" sizes="48x48">
<link rel="icon" href="/projects/checklist/icon.svg" sizes="any" type="image/svg+xml">
<link rel="apple-touch-icon" href="/projects/checklist/apple-touch-icon-180x180.png"></head>
  <body>
    <div id="app"></div>
  </body>
</html>
