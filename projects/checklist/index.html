<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Иконки и manifest вставляет vite-plugin-pwa (pwaAssets). theme-color —
         свой, ниже и в двух вариантах: шапка приложения закрашена в --primary,
         а он в светлой и тёмной теме разных оттенков, и одним статическим
         цветом строку статуса под неё не подогнать.

         Работает это только на десктопе (установленное PWA в Chrome/Edge) и
         во вкладке в светлой теме. На Android теги не участвуют вообще:
         строку статуса установленного приложения красит theme_color из
         манифеста, запечённый в WebAPK при установке. Проверено сборкой, где
         манифест, светлый и тёмный теги были трёх разных цветов — строка
         взяла цвет манифеста в обеих темах. Так что порядок тегов, media и
         правка content из JS там роли не играют, и в тёмной теме на Android
         строка со светло-голубой шапкой не сойдётся — ограничение платформы.
         Chrome во вкладке в тёмной теме к тому же вовсе не красит свою панель
         в theme-color, рисует стандартную тёмную.

         Значения — --primary из src/app.css (#13383f и #79b8c4, те же
         исходные HEX, из которых он посчитан в OKLCH); менять нужно вместе
         с токеном. -->
    <meta name="theme-color" content="#13383f" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#79b8c4" media="(prefers-color-scheme: dark)" />
    <script>
      // Тема следует за системной. Токены shadcn переключаются классом .dark
      // на <html>, и ставить его некому — своего рантайма у темы нет. Скрипт
      // inline и выше разметки: подключённый файлом, он бы дал светлую вспышку
      // первого кадра.
      // Отсюда же вырастет ручной переключатель, если понадобится: достаточно
      // будет читать сохранённый выбор перед обращением к matchMedia.
      const systemDark = matchMedia('(prefers-color-scheme: dark)')
      const applyTheme = (e) => document.documentElement.classList.toggle('dark', e.matches)
      applyTheme(systemDark)
      systemDark.addEventListener('change', applyTheme)
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Safari игнорирует manifest при добавлении на домашний экран и читает
         только эти мета-теги. Chrome ругается на apple-версию как на
         устаревшую, но убрать её нельзя — Safari другую не понимает,
         поэтому держим обе. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Чеклисты" />
    <title>Чеклисты</title>
    <script type="module" crossorigin src="/projects/checklist/assets/index-CbOfv5ME.js"></script>
    <link rel="stylesheet" crossorigin href="/projects/checklist/assets/index-B20Ya2FS.css">
