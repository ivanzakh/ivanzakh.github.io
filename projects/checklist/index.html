<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Иконки и manifest вставляет vite-plugin-pwa (pwaAssets). theme-color —
         свой, ниже и в двух вариантах: у манифеста только один статический цвет
         на все темы, а шапка приложения закрашена в --primary, который в
         светлой и тёмной теме — разные оттенки, и статус-бар ОС разъезжался
         бы с ней.

         Теги обязаны стоять здесь — выше любого <script>. Chrome на Android
         фиксирует цвет строки статуса установленного WebAPK в самом начале
         разбора <head> и позже его не пересматривает; синхронный скрипт
         останавливает парсер, и теги за ним в расчёт уже не идут — строка
         откатывается на theme_color из манифеста, то есть на светлый цвет
         в обеих темах. По той же причине не годится и один тег, которому
         content правит JS. На десктопе работает любой из вариантов.

         Значения — --primary из src/app.css (#13383f и #79b8c4, те же
         исходные HEX, из которых он посчитан в OKLCH); менять нужно вместе
         с токеном. -->
    <!-- ВРЕМЕННО, ДИАГНОСТИКА — вернуть #13383f / #79b8c4 после проверки. -->
    <meta name="theme-color" content="#00ff00" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0000ff" media="(prefers-color-scheme: dark)" />
    <script>
      // Тема следует за системной. Токены shadcn переключаются классом .dark
      // на <html>, и ставить его некому — своего рантайма у темы нет. Скрипт
      // inline и выше разметки: подключённый файлом, он бы дал светлую вспышку
      // первого кадра.
      // Отсюда же вырастет ручной переключатель, если понадобится: достаточно
      // будет читать сохранённый выбор перед обращением к matchMedia.
      const systemDark = matchMedia('(prefers-color-scheme: dark)')
      const applyTheme = (e) => document.documentElement.classList.toggle('dark', e.matches)
      applyTheme(systemDark)
      systemDark.addEventListener('change', applyTheme)
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Safari игнорирует manifest при добавлении на домашний экран и читает
         только эти мета-теги. Chrome ругается на apple-версию как на
         устаревшую, но убрать её нельзя — Safari другую не понимает,
         поэтому держим обе. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Чеклисты" />
    <title>Чеклисты</title>
    <script type="module" crossorigin src="/projects/checklist/assets/index-BzHpxMPh.js"></script>
