<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Тема следует за системной. Токены shadcn переключаются классом .dark
      // на <html>, и ставить его некому — своего рантайма у темы нет. Скрипт
      // inline и выше разметки: подключённый файлом, он бы дал светлую вспышку
      // первого кадра.
      // Отсюда же вырастет ручной переключатель, если понадобится: достаточно
      // будет читать сохранённый выбор перед обращением к matchMedia.
      const systemDark = matchMedia('(prefers-color-scheme: dark)')
      const applyTheme = (e) => document.documentElement.classList.toggle('dark', e.matches)
      applyTheme(systemDark)
      systemDark.addEventListener('change', applyTheme)
    </script>
    <!-- Иконки и manifest вставляет vite-plugin-pwa (pwaAssets). theme-color —
         свой, ниже и в двух вариантах: у манифеста только один статический цвет
         на все темы, а шапка приложения красится в --background, который в
         тёмной теме почти чёрный, и статус-бар ОС разъезжался бы с ней.
         Значения — вычисленные --background из src/app.css (oklch(1 0 0) и
         oklch(0.148 0.004 228.8)); менять их нужно вместе с токенами. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090b0c" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Safari игнорирует manifest при добавлении на домашний экран и читает
         только эти мета-теги. Chrome ругается на apple-версию как на
         устаревшую, но убрать её нельзя — Safari другую не понимает,
         поэтому держим обе. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Чеклисты" />
    <title>Чеклисты</title>
    <script type="module" crossorigin src="/projects/checklist/assets/index-CwaWKXam.js"></script>
