<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Иконки и manifest вставляет vite-plugin-pwa (pwaAssets). Один тег без
         media, а не пара с prefers-color-scheme: в установленном PWA
         системная строка статуса красится по theme_color из манифеста, а
         у него нет медиа-варианта — там только светлый, и пара условных тегов
         ниже на неё не влияла бы. content обновляет inline-скрипт вместе с
         классом .dark, поэтому тег должен стоять до script. Значения — то же
         --primary, что и у шапки (#13383f и #79b8c4 — исходные HEX, из
         которых он посчитан в OKLCH в src/app.css); менять нужно вместе. -->
    <meta name="theme-color" content="#13383f" id="theme-color-meta" />
    <script>
      // Тема следует за системной. Токены shadcn переключаются классом .dark
      // на <html>, и ставить его некому — своего рантайма у темы нет. Скрипт
      // inline и выше разметки: подключённый файлом, он бы дал светлую вспышку
      // первого кадра.
      // Отсюда же вырастет ручной переключатель, если понадобится: достаточно
      // будет читать сохранённый выбор перед обращением к matchMedia.
      const systemDark = matchMedia('(prefers-color-scheme: dark)')
      const themeColorMeta = document.getElementById('theme-color-meta')
      const applyTheme = (e) => {
        document.documentElement.classList.toggle('dark', e.matches)
        themeColorMeta.setAttribute('content', e.matches ? '#79b8c4' : '#13383f')
      }
      applyTheme(systemDark)
      systemDark.addEventListener('change', applyTheme)
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Safari игнорирует manifest при добавлении на домашний экран и читает
         только эти мета-теги. Chrome ругается на apple-версию как на
         устаревшую, но убрать её нельзя — Safari другую не понимает,
         поэтому держим обе. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Чеклисты" />
    <title>Чеклисты</title>
